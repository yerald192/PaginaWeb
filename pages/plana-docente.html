<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plana Docente del Instituto de Educación Superior Público Huanta: docentes especializados por carrera, unidades didácticas y hojas de vida del periodo 2026-II." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/tailwind.generated.css" />
    <title>Plana Docente | IESTP Huanta</title>
  </head>
  <body class="bg-[#fbfcfa] text-ink antialiased">
    <!-- ENCABEZADO DINÁMICO (RENDERIZADO EN JS) -->
    <header id="site-header" class="sticky top-0 z-40 bg-white shadow-sm"></header>

    <main id="plana-docente-main">
      <!-- HERO DINÁMICO DE PLANA DOCENTE -->
      <section id="plana-docente-hero" class="bg-navy"></section>

      <!-- BARRA DE CONTROLES (BÚSQUEDA, FILTRO, VISTA) -->
      <section id="plana-docente-controls" class="sticky top-20 z-30 border-b border-slate-200/90 bg-white/95 backdrop-blur shadow-sm"></section>

      <!-- CONTENEDOR PRINCIPAL DE DOCENTES (TABLA / CARDS) -->
      <section id="plana-docente-content" class="bg-[#fbfcfa] min-h-[500px]"></section>
    </main>

    <!-- PIE DE PÁGINA DINÁMICO (RENDERIZADO EN JS) -->
    <footer id="site-footer"></footer>

    <!-- SCRIPTS DINÁMICOS -->
    <script src="../js/data.js"></script>
    <script src="../js/icons.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/plana-docente.js"></script>
    <script src="../js/footer.js"></script>
  </body>
</html>
