<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Conoce la historia, licenciamiento, misión, visión, valores, organización y plana jerárquica del Instituto de Educación Superior Público Huanta." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/tailwind.generated.css" />
    <title>Nosotros | Presentación Institucional | IESTP Huanta</title>
  </head>
  <body class="bg-[#fbfcfa] text-ink antialiased">
    <!-- ENCABEZADO DINÁMICO (RENDERIZADO EN JS) -->
    <header id="site-header" class="sticky top-0 z-40 bg-white shadow-sm"></header>

    <main id="nosotros-main">
      <!-- HERO DINÁMICO -->
      <section id="nosotros-hero" class="bg-navy text-white"></section>

      <!-- BARRA DE PESTAÑAS / NAVEGACIÓN RÁPIDA -->
      <nav id="nosotros-tabs-nav" class="sticky top-20 z-30 border-b border-slate-200/90 bg-white/95 backdrop-blur" aria-label="Secciones de Nosotros"></nav>

      <!-- RESEÑA HISTÓRICA & PRESENTACIÓN -->
      <section id="historia" class="border-b border-slate-200 bg-white scroll-mt-36"></section>

      <!-- INSTITUTO LICENCIADO -->
      <section id="licenciamiento" class="bg-mist border-b border-slate-200 scroll-mt-36"></section>

      <!-- MISIÓN, VISIÓN Y VALORES -->
      <section id="valores" class="border-b border-slate-200 bg-white scroll-mt-36"></section>

      <!-- ORGANIZACIÓN INSTITUCIONAL -->
      <section id="organizacion" class="bg-mist border-b border-slate-200 scroll-mt-36"></section>

      <!-- PLANA JERÁRQUICA -->
      <section id="plana-jerarquica" class="border-b border-slate-200 bg-white scroll-mt-36"></section>
    </main>

    <!-- PIE DE PÁGINA DINÁMICO (RENDERIZADO EN JS) -->
    <footer id="site-footer"></footer>

    <!-- SCRIPTS DINÁMICOS -->
    <script src="../js/data.js"></script>
    <script src="../js/icons.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/nosotros.js"></script>
    <script src="../js/footer.js"></script>
  </body>
</html>
