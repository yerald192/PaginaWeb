<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Instituto de Educación Superior Público Huanta: formación técnica de calidad para transformar tu futuro." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/tailwind.generated.css" />
    <title>IESTP Huanta | Educación superior tecnológica</title>
  </head>

  <body>
    <!-- HEADER -->
    <header id="site-header" class="border-b border-slate-200/80 bg-white shadow-sm shadow-slate-200/40"></header>

    <!-- MAIN  -->
    <main>
      <!-- HERO -->
      <section id="hero" class="home-hero text-white"></section>

      <!-- ESTADISTICAS -->
      <section id="estadisticas" class="border-y border-slate-200 bg-mist py-16 lg:py-20"></section>

      <!-- CARRERAS -->
      <section id="carreras" class="section-wrap py-20 lg:py-28"></section>

      <!-- SERVICIOS -->
      <section id="servicios" class="bg-mist py-20 lg:py-24"></section>

      <!-- MISIÓN, VISIÓN Y VALORES -->
      <section id="mision-vision" class="section-wrap py-20 lg:py-28"></section>

      <!-- EVENTOS -->
      <section id="eventos" class="border-y border-slate-200 bg-white py-20 lg:py-24"></section>

      <!-- GALERIA -->
      <section id="galeria" class="section-wrap py-20 lg:py-24"></section>

      <!-- TESTIMONIOS -->
      <section id="testimonios" class="bg-mist py-20 lg:py-24"></section>

      <!-- NOTICIAS -->
      <section id="noticias" class="section-wrap py-20 lg:py-24"></section>

      <!-- ENLACES DE INTERÉS -->
      <section id="enlaces-interes" class="border-y border-slate-200 bg-white py-16 lg:py-20"></section>

      <!-- CONTACTO -->
      <section id="contacto" class="bg-mist py-20 lg:py-24"></section>
    </main>

    <!-- FOOTER -->
    <footer id="site-footer" class="border-t-4 border-gold bg-navy text-white" aria-labelledby="footer-title"></footer>

    <!-- SCRIPTS -->
    <script src="js/data.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/header.js"></script>
    <script src="js/app.js"></script>
    <script src="js/footer.js"></script>
  </body>
</html>
